<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — King Fahad National Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="register-page">

  <div class="page">

    <div class="brand">
      <img src="{{ url_for('static', filename='slogan.jpg') }}" alt="LibraryLogo" class="logo-img">
      <h1>King Fahad National Library</h1>
      <p>Member Registration</p>
    </div>

    <div class="card">
      <h2>Create your account</h2>
      <p>Please fill in your details to access the library.</p>

      {% if error %}
      <div id="messageBox" class="error" style="display:block;">{{ error }}</div>
      {% else %}
      <div id="messageBox"></div>
      {% endif %}

      <form id="registerForm" method="POST" action="{{ url_for('register') }}">

        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="e.g. Ahmed Mohammed" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
        </div>

        <div class="form-group">
          <label for="address">Address</label>
          <input type="text" id="address" name="address" placeholder="Riyadh" required>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" placeholder="05xxxxxxxx" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Register & Enter</button>

      </form>

          </div>

    <footer>
  <p><small>&copy; 2026 King Fahad National Library</small></p>
</footer>
  

  <script src="{{ url_for('static', filename='script.js') }}"></script>


       
</body>
</html>
